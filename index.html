<!DOCTYPE html>
<html>
<head>
<title>Interview Genie</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

<style>
body { font-family: Arial; padding: 20px; }
textarea { width: 100%; height: 100px; }
button { margin-top: 10px; padding: 10px; }
video { width: 100%; margin-top: 10px; border-radius: 10px; }
</style>

</head>

<body>

<h1>Interview Genie AI</h1>

<textarea id="answerInput" placeholder="Type your answer..."></textarea>

<br>

<button onclick="checkAnswer()">Check</button>
<button onclick="toggleVoice()">🎤 Voice</button>
<button onclick="initVideo()">📷 Camera</button>

<div id="result"></div>

<video id="videoElement" autoplay playsinline style="display:none"></video>

<script>

// ✅ STATE FIX
const state = {
  aiBaseUrl: "",
  recognition: null,
  isRecording: false
};

// ✅ TOAST FIX
function toast(msg){
  console.log(msg);
}

// ✅ SIMPLE CHECK FUNCTION
function checkAnswer(){
  const ans = document.getElementById("answerInput").value;
  document.getElementById("result").innerText = "Your answer: " + ans;
}

// 🎤 VOICE
function initVoice() {
  window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!window.SpeechRecognition) return toast("Not supported");

  state.recognition = new SpeechRecognition();
  state.recognition.continuous = true;

  state.recognition.onresult = (e) => {
    const text = Array.from(e.results).map(r=>r[0].transcript).join("");
    document.getElementById("answerInput").value = text;
  };
}

function toggleVoice() {
  if (!state.recognition) initVoice();

  if (state.isRecording) {
    state.recognition.stop();
    state.isRecording = false;
  } else {
    state.recognition.start();
    state.isRecording = true;
  }
}

// 📷 CAMERA
async function initVideo() {
  const video = document.getElementById("videoElement");
  video.style.display = "block";

  const faceMesh = new FaceMesh({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.onResults(() => {
    console.log("Face detected 👍");
  });

  const camera = new Camera(video, {
    onFrame: async () => {
      await faceMesh.send({ image: video });
    },
    width: 640,
    height: 480
  });

  camera.start();
}

</script>

</body>
</html>
